[project]
name = "beacon-host"
version = "0.1.0"
description = "Host daemon for Session Beacon: receives Claude Code hook events and drives the USB display"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
beacon-host = "beacon_host.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_host"]

[tool.ruff]
line-length = 100
