# Copy to config.local.toml OR config.toml. Both are read automatically and
# both are gitignored; config.local.toml wins if you somehow have both.
# Every value here is optional; these are the defaults.

# COM port. Omit entirely to auto-detect the Nano ESP32 by USB VID/PID, which
# survives the cable moving to a different physical port.
port = "COM4"

http_port = 47391      # must match the URL in the Claude Code hook commands
stale_after_s = 300    # a busy session with no events for this long goes stale

# A session waiting on you pulses red, then holds a static red, then settles to
# amber. Both are measured from when it started waiting, not from the previous
# rung, so these are 2 minutes of pulsing and 8 more of red.
need_pulse_s = 120     # pulses for this long, then holds red without moving
need_red_s = 600       # red for this long in total, then goes amber and quiet
ended_grace_s = 30     # how long a closed session stays on screen
max_rows = 6           # rows the display can show; the host sorts and truncates

# log_file = "C:/Users/you/AppData/Local/session-beacon/beacon-host.log"

# Session state is saved here and reloaded at startup, because a session parked
# on a prompt sends no hook events: without it, a restart at logon drops every
# waiting session and the display under-reports until you touch each one.
# Defaults to sessions.json beside the log, which uninstall.ps1 already clears.
# Run with --no-persist to switch it off.
# state_file = "C:/Users/you/AppData/Local/session-beacon/sessions.json"
restore_max_age_s = 86400   # on restart, ignore sessions untouched for longer
log_level = "INFO"

# Rows are labelled with the last path segment of the session's directory.
# Override where that is too long or ambiguous. Keys accept either separator.
#
# Use TOML *literal* strings, the single-quoted kind, for backslash paths.
# A lone backslash inside a double-quoted TOML string is a parse error:
#   'C:\Repos\thing' = "thg"     correct
#   "C:\Repos\thing" = "thg"     fails to parse
[labels]
"C:/Repos/long-project-name" = "fd-research"
"C:/Repos/another-long-repo" = "tropical-alg"
